name: deluxegames
services:
  app:
    profiles: ["full"]
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      APP_URL: ${APP_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://deluxegames:${POSTGRES_PASSWORD}@db:5432/deluxegames
      SUPABASE_DATABASE_URL: ${SUPABASE_DATABASE_URL:-}
      SUPABASE_DB_PASSWORD: ${SUPABASE_DB_PASSWORD:-}
      SUPABASE_DATABASE_SCHEMA: ${SUPABASE_DATABASE_SCHEMA:-deluxegames}
      SUPABASE_SSL_CA_FILE: ${SUPABASE_SSL_CA_FILE:-}
      SUPABASE_SSL_CA: ${SUPABASE_SSL_CA:-}
    volumes:
      - ./.local/certs:/app/.local/certs:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/products').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 12
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: deluxegames
      POSTGRES_USER: deluxegames
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run local:setup first}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - deluxe-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deluxegames -d deluxegames"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  deluxe-data:
